# Render Blueprint: one free web service (Docker) serving the API and the React app.
# Secrets are entered in the Render dashboard (sync: false) and never committed.
services:
  - type: web
    name: collectiq-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_INVOICER_EMAIL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: LLM_FALLBACK_MODEL
        sync: false
      - key: LLM_REASONING_EFFORT
        value: low
      - key: AI_RATE_LIMIT_PER_HOUR
        value: "30"
      - key: AUTOPILOT_INTERVAL_MINUTES
        value: "0"
